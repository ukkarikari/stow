# -- controls

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# -- appearance
set-option -g pane-active-border-style fg=orange
set-option -g pane-border-style fg=black

set -g set-titles on
set -g set-titles-string "#S:#I.#P #W"

set -g status on
set -g status-left-length 40

set -g status-left  '#S'

set -g status-right '#{?client_prefix,#[fg=black#,bg=orange] ! #[default] ,}   #H | %H:%M '

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"


# -- controls

setw -g mode-keys vi

bind r {
	source-file ~/.tmux.conf
	display-message "tmux.conf reloaded"
}

# -- loading config from remote
bind R {
	run-shell 'curl -fsSL https://raw.githubusercontent.com/ukkarikari/stow/master/tmux/.tmux.conf -o /tmp/.tmux.conf' 
	source-file /tmp/.tmux.conf
	display-message "tmux.conf successfully updated !!!"
}
