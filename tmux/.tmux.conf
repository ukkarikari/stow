# -- controls

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# -- appearance

set -g set-titles on
set -g set-titles-string "#S:#I.#P #W"

set -g status on
set -g status-left-length 40

set -g status-left  '#S'

set -g status-right '#{?client_prefix,#[fg=white#,bg=black] ! #[default] ,}   #H | %H:%M '

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"


# -- controls

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


setw -g mode-keys vi

# -- loading config from remote
bind R run-shell 'curl -fsSL https://raw.githubusercontent.com/ukkarikari/stow/master/tmux/.tmux.conf -o ~/.tmux.conf' \; source-file ~/.tmux.conf \; display-message "tmux.conf successfully updated !!!"
